name: Trios Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Verify Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
        - name: Set up Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 22


      - name: Install dependencies
        run: npm install

      - name: Build Trios
        run: npm run build